name: Build Analytics Metrics

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  build-metrics:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ secrets.APP_URL || 'https://scolta.nomade-artisan.fr' }}

    steps:
      - name: Trigger analytics build
        run: |
          curl -fsSL "$APP_URL/api/analytics/build-metrics"